services:
    backend:

        # backend 폴더를 빌드 대상으로 사용
        build:
            context: .
            dockerfile: Dockerfile

        # 컨테이너 이름
        container_name: storydream-backend

        # 로컬 8080 포트 -> 컨테이너 8080 포트 연결
        ports:
            - "8080:8080"

        # 환경변수 파일 로드
        env_file:
            - .env

        # Docker 재시작 시 자동 실행
        restart: unless-stopped