spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: false
jwt:
  secret: ${JWT_SECRET}        # 최소 32바이트 이상 (HS256)
  expiration: 86400000         # 24시간(ms)

story:
  dataset:
    ko:
      generator-type: GPT
      version: v1

    en:
      generator-type: FINE_TUNED
      version: v1
ai:
  server:
    base-url: http://localhost:8000