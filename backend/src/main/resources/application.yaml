spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: false
jwt:
  secret: ${JWT_SECRET}        # 최소 32바이트 이상 (HS256)
  expiration: 3600000          # 1시간(ms)