name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: storydream-ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Build and deploy on EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_PROJECT_PATH: ${{ secrets.EC2_PROJECT_PATH }}
          EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS EC2_PROJECT_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          [[ "$EC2_SSH_PORT" =~ ^[0-9]+$ ]] || { echo 'Invalid SSH port'; exit 1; }
          [[ "$EC2_HOST" != -* && "$EC2_USER" != -* ]] || exit 1

          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$EC2_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          # Base64 keeps the path out of remote shell quoting/interpolation.
          project_path=$(printf '%s' "$EC2_PROJECT_PATH" | base64 -w 0)
          ssh -T -i "$ssh_dir/key" -p "$EC2_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$EC2_USER@$EC2_HOST" "bash -s -- '$project_path'" <<'REMOTE'
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          project_path=$(printf '%s' "$1" | base64 --decode)
          [[ "$project_path" = /* ]] || { echo 'Project path must be absolute'; exit 1; }
          cd -- "$project_path"
          test -f docker-compose.yml
          command -v flock >/dev/null
          exec 9>"$(git rev-parse --git-path storydream-deploy.lock)"
          flock -n 9 || { echo 'Another EC2 deployment is running'; exit 1; }

          [[ "$(git branch --show-current)" == main ]] || {
            echo 'EC2 checkout must be on main'; exit 1;
          }
          [[ -z "$(git status --porcelain)" ]] || {
            echo 'EC2 checkout has local changes; deployment stopped'; exit 1;
          }

          docker compose version
          # Reclaim space before fetching/building; container-referenced images stay.
          echo 'Docker disk usage before cleanup'
          docker system df
          docker builder prune -af
          docker image prune -af
          echo 'Docker disk usage after cleanup'
          docker system df

          # Always deploy the latest main, including when an older run is retried.
          git fetch origin main
          git merge --ff-only origin/main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo 'EC2 main contains local commits; deployment stopped'; exit 1;
          }
          test -f backend/.env
          test -f AI/ai-server/.env
          docker compose config --quiet
          echo "Deploying commit $(git rev-parse HEAD)"

          # Keep existing containers running until both images finish building.
          docker compose build backend
          # Release intermediate build cache before building the next service.
          # Do not prune images here: the new backend image is not in use yet.
          docker builder prune -af
          docker compose build ai-server
          if ! docker compose up -d --no-build --wait --wait-timeout 180 ai-server backend; then
            docker compose ps --all
            echo 'Deployment failed. Check container logs on EC2.'
            exit 1
          fi
          docker compose ps
          # Only prune old images after the new containers have started successfully.
          docker builder prune -af
          docker image prune -af
          echo 'Docker disk usage after deployment cleanup'
          docker system df
          REMOTE
